<body>
<div class="login-container">
    <div id="steps" class="login-card">
        <div class="brand-header">
            <img src="/img/fr-ico.png" alt="Logo" class="logo" />
            <h4>Identity Portal</h4>
        </div>

        <div id="loader" class="step-content active">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Connecting to Secure Vault...</p>
        </div>

        <div id="UsernamePassword" class="step-content">
            <h2 class="text-center mb-4">Sign In</h2>
            <div class="form-group">
                <label>Username</label>
                <input class="form-control custom-input" type="text" name="username" placeholder="Enter your ID" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input class="form-control custom-input" type="password" name="password" placeholder="••••••••" />
            </div>
            <button class="btn btn-primary btn-block shadow-sm py-2 mt-3">Access System</button>
        </div>

        <div id="User" class="step-content">
            <div class="alert alert-success">Authentication Verified</div>
            <p class="small text-muted text-uppercase font-weight-bold">Identity Profile</p>
            <pre class="user-data-box"></pre>
            <button class="btn btn-outline-danger btn-block mt-3">Secure Sign Out</button>
        </div>

        <div id="Error" class="step-content">
            <div class="alert alert-danger">Access Denied</div>
            <p>Security Code: <span class="badge badge-danger"></span></p>
            <a id="start-over" class="btn btn-link btn-block" href="/">Return to Gate</a>
        </div>
    </div>
</div>
</body>
