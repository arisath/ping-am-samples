<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 PKCE SPA</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 900px; margin: auto; line-height: 1.5; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; overflow-x: auto; border-radius: 8px; font-size: 13px; }
        .hidden { display: none; }
        .label { font-weight: bold; color: #555; margin-top: 1.5rem; display: block; }
        h4 { margin-bottom: 0.5rem; border-bottom: 1px solid #ddd; padding-bottom: 5px; }

        /* Provider selector */
        .provider-bar {
            display: flex; align-items: center; gap: 1rem;
            background: #f8f9fa; border: 1px solid #dee2e6;
            border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1.5rem;
        }
        .provider-bar span { font-size: .85rem; color: #555; font-weight: 600; }
        .provider-bar label { display: flex; align-items: center; gap: .35rem; cursor: pointer; font-size: .9rem; }
        .provider-badge { font-size: .75rem; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
        .badge-ping   { background: #e8f4fd; color: #1a73e8; }
        .badge-spring { background: #e6f4ea; color: #137333; }
    </style>
</head>
<body>
<h1>SPA — OAuth2 PKCE Flow</h1>

<div class="provider-bar">
    <span>IdP:</span>
    <label>
        <input type="radio" name="provider" value="ping" onchange="switchProvider(this.value)">
        <span class="provider-badge badge-ping">Ping AM</span>
        <small style="color:#888">:8080</small>
    </label>
    <label>
        <input type="radio" name="provider" value="spring" onchange="switchProvider(this.value)">
        <span class="provider-badge badge-spring">Spring Auth Server</span>
        <small style="color:#888">:9000</small>
    </label>
</div>

<div id="login-section">
    <p>This SPA demonstrates a secure OAuth2 PKCE flow with manual JWT decoding.</p>
    <button onclick="login()">Log In</button>
</div>

<div id="app-section" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Authenticated!</h3>
        <button onclick="logout()" style="background: #dc3545;">Log Out</button>
    </div>

    <h4>Decoded ID Token (OIDC Claims):</h4>
    <pre id="decoded-output"></pre>

    <h4>Raw Token Response:</h4>
    <pre id="token-output"></pre>
</div>

<script>
    // ── Provider registry ──────────────────────────────────────────────────
    const PROVIDERS = {
        ping: {
            label:        "Ping AM",
            authorizeUrl: "http://localhost:8080/am/oauth2/realms/root/authorize",
            tokenUrl:     "http://localhost:8080/am/oauth2/realms/root/access_token",
        },
        spring: {
            label:        "Spring Auth Server",
            authorizeUrl: "http://localhost:9000/oauth2/authorize",
            tokenUrl:     "http://localhost:9000/oauth2/token",
        }
    };

    const CLIENT_ID   = "my-spa-client";
    const REDIRECT_URI = "http://localhost:3000/";
    const SCOPE        = "openid profile";

    function getProvider() {
        return localStorage.getItem("oauth2_provider") || "ping";
    }

    function switchProvider(value) {
        localStorage.setItem("oauth2_provider", value);
    }

    // Restore saved selection on load
    (function initSelector() {
        const saved = getProvider();
        document.querySelectorAll('input[name="provider"]').forEach(r => {
            r.checked = (r.value === saved);
        });
    })();

    // ── JWT Decoder ────────────────────────────────────────────────────────
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(
                window.atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join('')
            );
            return JSON.parse(jsonPayload);
        } catch (e) {
            return { error: "Failed to decode ID Token" };
        }
    }

    // ── PKCE Utilities ─────────────────────────────────────────────────────
    function generateRandomString(length) {
        const array = new Uint32Array(length / 2);
        window.crypto.getRandomValues(array);
        return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('');
    }

    async function generateCodeChallenge(codeVerifier) {
        const encoder = new TextEncoder();
        const digest = await window.crypto.subtle.digest('SHA-256', encoder.encode(codeVerifier));
        return btoa(String.fromCharCode(...new Uint8Array(digest)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // ── Auth Flow ──────────────────────────────────────────────────────────
    async function login() {
        const provider = PROVIDERS[getProvider()];
        const state = generateRandomString(32);
        const codeVerifier = generateRandomString(64);
        sessionStorage.setItem("pkce_state", state);
        sessionStorage.setItem("pkce_verifier", codeVerifier);
        sessionStorage.setItem("pkce_provider", getProvider());

        const codeChallenge = await generateCodeChallenge(codeVerifier);

        const authUrl = new URL(provider.authorizeUrl);
        authUrl.searchParams.append("response_type", "code");
        authUrl.searchParams.append("client_id", CLIENT_ID);
        authUrl.searchParams.append("redirect_uri", REDIRECT_URI);
        authUrl.searchParams.append("scope", SCOPE);
        authUrl.searchParams.append("state", state);
        authUrl.searchParams.append("code_challenge", codeChallenge);
        authUrl.searchParams.append("code_challenge_method", "S256");

        window.location.href = authUrl.toString();
    }

    async function handleCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const state = params.get("state");

        if (!code) return;

        const savedState    = sessionStorage.getItem("pkce_state");
        const codeVerifier  = sessionStorage.getItem("pkce_verifier");
        const savedProvider = sessionStorage.getItem("pkce_provider") || getProvider();

        if (state !== savedState) { alert("State mismatch!"); return; }

        window.history.replaceState({}, document.title, REDIRECT_URI);

        // Restore provider selection from session (in case page reloaded between redirects)
        localStorage.setItem("oauth2_provider", savedProvider);
        document.querySelectorAll('input[name="provider"]').forEach(r => {
            r.checked = (r.value === savedProvider);
        });

        const provider = PROVIDERS[savedProvider];

        try {
            const response = await fetch(provider.tokenUrl, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    grant_type:    "authorization_code",
                    client_id:     CLIENT_ID,
                    redirect_uri:  REDIRECT_URI,
                    code:          code,
                    code_verifier: codeVerifier
                })
            });

            if (!response.ok) throw new Error(await response.text());
            const tokens = await response.json();

            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("app-section").classList.remove("hidden");

            document.getElementById("decoded-output").textContent = tokens.id_token
                ? JSON.stringify(parseJwt(tokens.id_token), null, 2)
                : "No ID Token in response — ensure 'openid' scope was requested.";

            document.getElementById("token-output").textContent = JSON.stringify(tokens, null, 2);

        } catch (error) {
            console.error("Token exchange failed:", error);
            alert("Token exchange failed: " + error.message);
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.replace(REDIRECT_URI);
    }

    handleCallback();
</script>
</body>
</html>
