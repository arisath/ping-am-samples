<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spring Auth Server — Sign In</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
            padding: 2.5rem 2rem;
            width: 360px;
        }
        .badge {
            display: inline-block;
            background: #e8f4fd;
            color: #1a73e8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .5px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: .75rem;
        }
        h1 { font-size: 1.4rem; margin: 0 0 1.5rem; color: #111; }
        label { display: block; font-size: .85rem; color: #555; margin-bottom: .25rem; }
        input[type=text], input[type=password] {
            width: 100%;
            padding: .6rem .8rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: .95rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color .15s;
        }
        input:focus { border-color: #1a73e8; }
        button {
            width: 100%;
            padding: .7rem;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1558b0; }
        .error {
            background: #fff0f0;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: .6rem .8rem;
            border-radius: 6px;
            font-size: .85rem;
            margin-bottom: 1rem;
        }
        .hint {
            margin-top: 1.25rem;
            font-size: .8rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <span class="badge">Spring Authorization Server</span>
    <h1>Sign In</h1>

    <div th:if="${param.error}" class="error">Invalid username or password.</div>

    <form method="post" th:action="@{/login}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="demo" autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="password">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Sign In</button>
    </form>

    <p class="hint">Default credentials: <strong>demo / password</strong></p>
</div>
</body>
</html>
